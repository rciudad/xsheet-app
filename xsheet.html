<html>
  <style>
    * {
      box-sizing: border-box;
    }
    :root {
      --ink-950: #eceef3;
      --ink-900: #ffffff;
      --ink-850: #f6f7f9;
      --ink-800: #edeef2;
      --ink-700: #d9dbe2;
      --ink-600: #c2c5cf;
      --accent: #ff5b2e;
      --teal: #46c2b0;
      --violet: #9b8cff;
      --text: #1c1e24;
      --text-dim: #565968;
      --text-faint: #868999;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
        Arial, sans-serif;
    }
    html,
    body {
      height: 100%;
      margin: 0;
    }
    body {
      background: var(--ink-950);
      color: var(--text);
      font-family: var(--font-ui);
    }
    button {
      font-family: inherit;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .toolbar {
      order: 1;
      flex-shrink: 0;
      height: auto;
      max-height: 30vh;
      overflow-y: auto;
      background: var(--ink-900);
      border-bottom: 1px solid var(--ink-700);
      padding: 10px 14px;
      line-height: 2.4;
    }
    .main-row {
      order: 2;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      overflow: hidden;
      background: var(--ink-950);
    }
    .bottom-toolbar {
      order: 3;
      flex-shrink: 0;
      background: var(--ink-950);
      border-top: 1px solid var(--ink-700);
      padding: 12px 14px;
      max-height: 40vh;
      overflow-y: auto;
    }
    .toolbar input:not([type="checkbox"]):not([type="color"]) {
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--ink-700);
      background: var(--ink-850);
      color: var(--text);
      padding: 0 6px;
      font-size: 13px;
    }
    .toolbar button {
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--ink-700);
      background: var(--ink-850);
      color: var(--text);
      font-size: 12px;
      padding: 0 10px;
      cursor: pointer;
    }
    .toolbar button:hover {
      background: var(--ink-800);
    }
    .toolbar label {
      color: var(--text-dim);
      font-size: 12px;
    }
    .transport {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }
    .titlebar input:not([type="checkbox"]):not([type="color"]),
    .transport input:not([type="checkbox"]):not([type="color"]) {
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--ink-700);
      background: var(--ink-850);
      color: var(--text);
      padding: 0 6px;
      font-size: 13px;
    }
    .titlebar button,
    .transport button {
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--ink-700);
      background: var(--ink-850);
      color: var(--text);
      font-size: 12px;
      padding: 0 10px;
      cursor: pointer;
    }
    .titlebar button:hover,
    .transport button:hover {
      background: var(--ink-800);
    }
    .titlebar label,
    .transport label {
      color: var(--text-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .titlebar {
      order: 1;
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--ink-900);
      border-bottom: 1px solid var(--ink-700);
    }
    .file-menu {
      position: relative;
    }
    .file-menu-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 600;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 260px;
      padding: 12px;
      background: var(--ink-900);
      border: 1px solid var(--ink-700);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .file-menu-dropdown[hidden] {
      display: none;
    }
    .file-menu-section {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .file-menu-heading {
      width: 100%;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
    }
    .wordmark {
      font-weight: 800;
      font-size: 16px;
      margin-right: 8px;
      color: var(--text);
    }
    .transport {
      order: 4;
      flex-shrink: 0;
      padding: 10px 16px;
      background: var(--ink-900);
      border-top: 1px solid var(--ink-700);
    }

    .rail {
      flex-shrink: 0;
      width: 90px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 14px 10px;
      background: var(--ink-900);
      border-right: 1px solid var(--ink-700);
      overflow-y: auto;
    }
    .rail button,
    .rail input {
      width: 100%;
    }
    .right-panel {
      flex-shrink: 0;
      width: 240px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--ink-900);
      border-left: 1px solid var(--ink-700);
      overflow-y: auto;
    }

    .right-panel button,
    .right-panel select,
    .right-panel input:not([type="checkbox"]) {
      width: 100%;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--ink-700);
      background: var(--ink-850);
      color: var(--text);
      font-size: 12px;
    }
    .right-panel label {
      color: var(--text-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .floating-bar {
      position: fixed;
      left: 50%;
      bottom: 70px;
      transform: translateX(-50%);
      z-index: 500;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      max-width: 90vw;
      padding: 10px 14px;
      background: var(--ink-900);
      border: 1px solid var(--ink-700);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .floating-bar[hidden] {
      display: none;
    }
    .floating-bar input:not([type="checkbox"]),
    .floating-bar select {
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--ink-700);
      background: var(--ink-850);
      color: var(--text);
      font-size: 13px;
      padding: 0 6px;
    }
    .floating-bar button {
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--ink-700);
      background: var(--ink-850);
      color: var(--text);
      font-size: 12px;
      padding: 0 10px;
      cursor: pointer;
    }
    .quick-dialog label,
    .file-menu-section label {
      color: var(--text-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .texture-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 260px;
    }
    .texture-thumb {
      width: 40px;
      height: 40px;
      object-fit: contain;
      background: var(--ink-850);
      border: 2px solid var(--ink-700);
      border-radius: 8px;
      cursor: pointer;
    }
    .texture-thumb.active {
      border-color: var(--accent);
    }
    .docked-bar {
      order: 3;
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      gap: 14px;
      padding: 8px 16px;
      background: var(--ink-900);
      border-top: 1px solid var(--ink-700);
    }
    .docked-bar[hidden] {
      display: none;
    }
    .docked-bar input:not([type="checkbox"]),
    .docked-bar select {
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--ink-700);
      background: var(--ink-850);
      color: var(--text);
      font-size: 13px;
      padding: 0 6px;
    }
    .docked-bar button {
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--ink-700);
      background: var(--ink-850);
      color: var(--text);
      font-size: 12px;
      padding: 0 10px;
      cursor: pointer;
    }
    .docked-bar button:hover {
      background: var(--ink-800);
    }
    .docked-bar label {
      color: var(--text-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .bottom-toolbar input {
      width: 55px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--ink-700);
      background: var(--ink-850);
      color: var(--text);
      font-size: 16px;
    }
    .bottom-toolbar button {
      width: auto;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--ink-700);
      background: var(--ink-850);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }
    .bottom-toolbar button:hover {
      background: var(--ink-800);
    }
    .bottom-toolbar select {
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--ink-700);
      background: var(--ink-850);
      color: var(--text);
    }
    .bottom-toolbar label {
      color: var(--text-dim);
      font-size: 13px;
    }
    .bottom-toolbar details {
      background: var(--ink-900);
      border: 1px solid var(--ink-700);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
    }
    .bottom-toolbar summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      padding: 4px 0;
    }
    .bottom-toolbar details[open] summary {
      color: var(--text);
      margin-bottom: 6px;
    }
    #drawingTable,
    #playCanvas {
      border: 1px solid var(--ink-700);
    }
    .xsheet {
      display: grid;
      flex: 0 0 auto;
      width: 320px;
      min-width: 160px;
      max-width: 70vw;
      min-height: 0;
      overflow: auto;
      background-color: var(--ink-900);
      color: var(--text);
    }
    .xsheet-resizer {
      flex: 0 0 auto;
      width: 6px;
      cursor: col-resize;
      background: var(--ink-700);
    }
    .xsheet-resizer:hover {
      background: var(--accent);
    }
    .canvas-area {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    #stageViewport {
      flex-shrink: 0;
      position: relative;
      width: min(100%, 800px);
      aspect-ratio: 800 / 600;
    }
    #stage {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
    }
    #stage canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .xsheet-th {
      border: 1px solid var(--ink-800);
      text-align: center;
      cursor: pointer;
      font-size: 12px;
      background: var(--ink-850);
      color: var(--text-faint);
      text-transform: uppercase;
    }
    .xsheet-th.active {
      background-color: var(--ink-700); /*accent*/
      color: var(--text);
    }
    .xsheet-tick {
      border: 1px solid var(--ink-700);
      text-align: right;
      padding-right: 4px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .xsheet-cell {
      border: 1px solid var(--ink-700);
      background-color: var(--ink-850);
      cursor: pointer;
      font-size: 12px;
      text-align: center;
      color: var(--text);
    }
    .xsheet-cell.active-col {
      background-color: var(--ink-800);
    }
    .xsheet-cell.current {
      /*background-color: var(--accent);*/
      color: var(--ink-950);
      border: 1px solid var(--accent);
    }
    .xsheet-cell input {
      width: 45px;
      position: relative;
      left: 19px;
      top: 4px;
      background: var(--ink-800);
      color: var(--text);
      border: 1px solid var(--ink-700);
      border-radius: 3px;
    }
    .xsheet-tick.current {
      /*background-color: var(--accent);
      color: var(--ink-950);*/
    }
    #audioPlayer {
      display: none;
    }
    .xsheet-audio-cell {
      border: 1px solid var(--ink-700);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: var(--ink-850);
    }
    .xsheet-audio-cell.current {
      border: 1px solid var(--accent);
    }
    .xsheet-audio-bar {
      width: 80%;
      background: var(--teal);
    }
    .mode-toggle-btn {
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 700;
      height: 28px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--ink-700);
      background: var(--ink-850);
      color: var(--text);
      font-size: 11px;
      cursor: pointer;
    }
    .mode-toggle-btn:hover {
      background: var(--ink-800);
    }
    .quick-dialog {
      position: fixed;
      z-index: 800;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      background: var(--ink-900);
      border: 1px solid var(--ink-700);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .quick-dialog[hidden] {
      display: none;
    }
    .quick-dialog button {
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--ink-700);
      background: var(--ink-850);
      color: var(--text);
      font-size: 12px;
      padding: 0 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .quick-dialog button:hover {
      background: var(--ink-800);
    }
    .quick-dialog-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .quick-dialog-btn-square {
      width: 56px;
      height: 56px;
      white-space: normal;
      line-height: 1.15;
      font-size: 10px;
      padding: 2px;
    }

    .quick-dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: move;
      padding-bottom: 6px;
      margin-bottom: 2px;
      border-bottom: 1px solid var(--ink-700);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
    }
    .mini-xsheet {
      display: flex;
      flex-direction: column;
      max-height: 260px;
      overflow-y: auto;
      border: 1px solid var(--ink-700);
      border-radius: 8px;
    }
    .mini-xsheet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 4px 8px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      border-bottom: 1px solid var(--ink-800);
    }
    .mini-xsheet-row:last-child {
      border-bottom: none;
    }
    .mini-xsheet-row:hover {
      background: var(--ink-850);
    }
    .mini-xsheet-row.current {
      background: var(--accent);
      color: var(--ink-950);
    }
    .mini-xsheet-row input {
      width: 50px;
      height: 22px;
      border-radius: 4px;
      border: 1px solid var(--ink-700);
      background: var(--ink-850);
      color: var(--text);
      font-size: 11px;
    }
    .mini-xsheet-row input[type="checkbox"] {
      width: auto;
    }
    .mini-xsheet-offset {
      font-size: 10px;
      color: var(--text-dim);
      min-width: 22px;
      text-align: right;
    }

    .app.drawing-mode .titlebar,
    .app.drawing-mode .transport,
    .app.drawing-mode .rail,
    .app.drawing-mode .right-panel,
    .app.drawing-mode .xsheet-resizer,
    .app.drawing-mode .xsheet,
    .app.drawing-mode .floating-bar {
      display: none !important;
    }
  </style>
  <body>
    <div class="app">
      <header class="titlebar">
        <div class="file-menu">
          <button type="button" id="file-menu-btn">ARCHIVO ▾</button>
          <div class="file-menu-dropdown" id="file-menu-dropdown" hidden>
            <div class="file-menu-section">
              <span class="file-menu-heading">Carpeta</span>
              <button type="button" id="choose-folder">CARPETA</button>
              <span id="folder-status"></span>
              <button type="button" id="clear-folder" style="display: none">
                QUITAR CARPETA
              </button>
            </div>
            <div class="file-menu-section">
              <span class="file-menu-heading">Proyecto</span>
              <button type="button" id="save-project">GUARDAR PROYECTO</button>
              <button type="button" id="import-project-btn">
                ABRIR PROYECTO
              </button>
              <input
                type="file"
                id="import-project"
                accept="application/json,.json"
                style="display: none"
              />
            </div>
            <div class="file-menu-section">
              <span class="file-menu-heading">Importar</span>
              <button type="button" id="import-image-btn">
                IMPORTAR IMAGEN
              </button>
              <input
                type="file"
                id="import-image"
                accept="image/*"
                style="display: none"
              />
              <label
                ><input type="checkbox" id="import-replace" /> Reemplazar frame
                actual (en vez de insertar uno nuevo)</label
              >
              <button type="button" id="import-batch-btn">
                IMPORTAR BATCH
              </button>
              <input
                type="file"
                id="import-batch"
                accept="image/*"
                multiple
                style="display: none"
              />
              <button type="button" id="import-audio-btn">
                IMPORTAR AUDIO
              </button>
              <input
                type="file"
                id="import-audio"
                accept="audio/*"
                style="display: none"
              />
            </div>
            <div class="file-menu-section">
              <span class="file-menu-heading">Exportar</span>
              <label for="export-prefix">Prefijo:</label>
              <input type="text" id="export-prefix" value="frame" />
              <label
                ><input type="checkbox" id="export-bg-toggle" /> Fondo</label
              >
              <input type="color" id="export-bg-color" value="#ffffff" />
              <button type="button" id="export-png">EXPORT PNG</button>
              <label
                ><input type="checkbox" id="export-zip-toggle" /> Zip</label
              >
              <label
                ><input type="checkbox" id="export-expand-toggle" checked /> Por
                hold</label
              >
              <button type="button" id="export-sequence">
                EXPORT SEQUENCE
              </button>
              <button type="button" id="export-video">EXPORT WEBM</button>
              <span id="export-video-status"></span>
              <button type="button" id="ffmpeg-cmd-btn">COMANDO FFMPEG</button>
              <div id="ffmpeg-cmd-box" style="display: none">
                <input
                  type="text"
                  id="ffmpeg-cmd-input"
                  readonly
                  style="width: 500px"
                />
                <div id="ffmpeg-cmd-hint" style="font-size: 12px"></div>
              </div>
            </div>
          </div>
        </div>
        <label for="resolution">RES:</label>

        <input list="resolutions" name="resolution" id="resolution" />
        <datalist id="resolutions">
          <option value="800x600"></option>
          <option value="1280x720"></option>
          <option value="1440x1080"></option>
          <option value="1920x1080"></option>
          <option value="1080x1440"></option>
          <option value="1080x1920"></option>
        </datalist>
        <button type="button" id="tool-pan">MANO</button>
        <button type="button" id="zoom-out">−</button>
        <span id="zoomReadout">100%</span>
        <button type="button" id="zoom-in">+</button>
        <button type="button" id="rotate-left">⟲</button>
        <span id="rotateReadout">0°</span>
        <button type="button" id="rotate-right">⟳</button>
        <button type="button" id="zoom-reset">RESET VISTA</button>
      </header>

      <audio id="audioPlayer"></audio>

      <div class="floating-bar" id="frames-bar" hidden>
        <button type="button" id="prev"><</button>
        <button type="button" id="next">></button>
        <button type="button" id="new-frame">ADD FRAME</button>
        <button type="button" id="insert-frame-left">INSERTAR IZQUIERDA</button>
      </div>
      <div class="floating-bar" id="edit-frames-bar" hidden>
        <label for="layer-hold-all">HOLD CAPA:</label>
        <input type="number" id="layer-hold-all" min="1" value="1" />
        <button type="button" id="apply-layer-hold">APLICAR</button>
        <button type="button" id="duplicate-frame">DUPLICAR</button>
        <label for="move-origin">Origen:</label>
        <input type="number" id="move-origin" min="1" value="1" />
        <label for="move-origin-end">Origen hasta:</label>
        <input type="number" id="move-origin-end" min="1" value="1" />
        <label for="move-dest">Destino:</label>
        <input type="number" id="move-dest" min="1" value="1" />
        <button type="button" id="move-frame">MOVER</button>
        <button type="button" id="copy-frame">COPIAR</button>
      </div>

      <div class="docked-bar" id="peg-bar" hidden>
        <label
          >Región 1: x<input type="number" id="peg1x" value="140" /> y<input
            type="number"
            id="peg1y"
            value="430" />
          w<input type="number" id="peg1w" value="90" /> h<input
            type="number"
            id="peg1h"
            value="60"
        /></label>
        <label
          >Región 2: x<input type="number" id="peg2x" value="570" /> y<input
            type="number"
            id="peg2y"
            value="430" />
          w<input type="number" id="peg2w" value="90" /> h<input
            type="number"
            id="peg2h"
            value="60"
        /></label>
        <button type="button" id="peg-set-ref">FIJAR REFERENCIA</button>
        <button type="button" id="peg-align-cel">ALINEAR CEL ACTUAL</button>
        <button type="button" id="peg-align-layer">ALINEAR CAPA ACTUAL</button>
      </div>
      <div class="docked-bar" id="adjust-bar" hidden>
        <label
          >Crop: x<input type="number" id="cropX" value="0" /> y<input
            type="number"
            id="cropY"
            value="0" />
          w<input type="number" id="cropW" value="800" /> h<input
            type="number"
            id="cropH"
            value="600"
        /></label>
        <label
          >Bright.<input type="number" id="adjBrightness" value="0" step="0.05"
        /></label>
        <label
          >Contraste<input type="number" id="adjContrast" value="1" step="0.05"
        /></label>
        <label
          >Saturación<input
            type="number"
            id="adjSaturation"
            value="1"
            step="0.05"
        /></label>
        <label
          >WB R<input type="number" id="adjWbR" value="1" step="0.05"
        /></label>
        <label
          >WB B<input type="number" id="adjWbB" value="1" step="0.05"
        /></label>
        <button type="button" id="adjust-reset">RESET AJUSTES</button>
        <label
          ><input type="checkbox" id="grade-preview-toggle" /> Vista
          previa</label
        >
      </div>
      <div class="floating-bar" id="texture-bar" hidden>
        <button type="button" id="brush-texture-btn">AGREGAR</button>
        <input
          type="file"
          id="brush-texture-input"
          accept="image/png"
          multiple
          style="display: none"
        />
        <div class="texture-gallery" id="texture-gallery"></div>
      </div>
      <div class="main-row">
        <aside class="rail">
          <input type="color" id="selectedColor" />
          <input type="number" id="brushSize" value="4" min="1" />
          <button type="button" id="tool-pencil">LÁPIZ</button>
          <button type="button" id="tool-eraser">GOMA</button>

          <select id="brush-style">
            <option value="hard">Duro</option>
            <option value="stamp">Textura</option>
            <option value="bristles">Cerdas</option>
          </select>

          <button type="button" id="texture-bar-toggle">TEXTURAS</button>

          <button type="button" id="peg-bar-toggle">PEG</button>
          <button type="button" id="adjust-bar-toggle">AJUSTES</button>
          <button type="button" id="frames-bar-toggle">FRAMES</button>
          <button type="button" id="edit-frames-bar-toggle">EDITAR</button>
        </aside>

        <div class="canvas-area">
          <div id="stageViewport">
            <div id="stage">
              <canvas
                id="onion"
                width="800"
                height="600"
                style="pointer-events: none"
              ></canvas>
              <canvas id="drawingTable" width="800" height="600"></canvas>
              <!--Se mantiene oculto mientras se dibuja, y se muestra (ocultando el canvas de dibujo) 
mientras se reproduce — la misma idea que el original con drawEl/playEl.-->
              <canvas
                id="playCanvas"
                width="800"
                height="600"
                style="display: none"
              ></canvas>

              <div
                id="pegOverlay1"
                style="
                  position: absolute;
                  border: 2px solid red;
                  pointer-events: none;
                  display: none;
                "
              ></div>
              <div
                id="pegOverlay2"
                style="
                  position: absolute;
                  border: 2px solid blue;
                  pointer-events: none;
                  display: none;
                "
              ></div>
              <div
                id="cropOverlay"
                style="
                  position: absolute;
                  border: 2px dashed lime;
                  pointer-events: none;
                  display: none;
                "
              ></div>
            </div>
          </div>
        </div>

        <div
          id="folder-browse-overlay"
          style="
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
          "
        >
          <div
            style="
              background: var(--ink-900);
              color: var(--text);
              padding: 18px;
              width: 420px;
              max-width: 90vw;
              max-height: 80vh;
              display: flex;
              flex-direction: column;
              border-radius: 12px;
              box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            "
          >
            <strong id="folder-browse-title">Elegir archivo</strong>
            <small id="folder-browse-path" style="margin-bottom: 8px"></small>
            <div
              id="folder-browse-list"
              style="
                flex: 1;
                overflow-y: auto;
                border: 1px solid #999;
                margin-bottom: 8px;
                min-height: 120px;
              "
            ></div>
            <div>
              <button type="button" id="folder-browse-up">↑ SUBIR</button>
              <button type="button" id="folder-browse-elsewhere">
                BUSCAR EN OTRO LADO...
              </button>
              <button type="button" id="folder-browse-confirm">IMPORTAR</button>
              <button type="button" id="folder-browse-cancel">CANCELAR</button>
            </div>
          </div>
        </div>

        <div class="xsheet-resizer" id="xsheet-resizer"></div>
        <div class="xsheet" id="xsheet"></div>
        <aside class="right-panel">
          <button type="button" id="new-layer">ADD LAYER</button>
          <label for="layers">LAYER:</label>
          <select id="layers">
            <option value="0">Selecciona una opción...</option>
          </select>
          <label for="layer-opacity">Opacidad capa:</label>
          <input
            type="number"
            id="layer-opacity"
            min="0"
            max="1"
            step="0.05"
            value="1"
          />
          <label
            ><input type="checkbox" id="onion-toggle" checked /> Onion
            skin</label
          >
          <label for="onion-opacity">Opacidad onion:</label>
          <input
            type="number"
            id="onion-opacity"
            min="0"
            max="1"
            step="0.05"
            value="0.35"
          />
        </aside>
      </div>
      <footer class="transport">
        <button type="button" id="play">PLAY</button>
        <label for="fps">FPS:</label>
        <input type="number" id="fps" min="1" max="30" value="12" />
        <button type="button" id="clear-drawing">BORRAR DIBUJO</button>
        <button type="button" id="delete-frame">ELIMINAR FRAME</button>
        <label for="range-start">REPRODUCIR/EXPORTAR Desde:</label>
        <input type="number" id="range-start" min="1" value="1" />
        <label for="range-end">Hasta:</label>
        <input type="number" id="range-end" min="1" value="1" />
      </footer>
    </div>
    <button type="button" id="drawing-mode-toggle" class="mode-toggle-btn">
      MODO DIBUJO
    </button>
    <div class="quick-dialog" id="quick-dialog" hidden>
      <div class="quick-dialog-header" id="quick-dialog-drag-handle">
        <span>Menú rápido</span>
        <button type="button" id="qd-hide">OCULTAR</button>
      </div>

      <div class="quick-dialog-row">
        <button type="button" id="qd-pencil" class="quick-dialog-btn-square">
          LÁPIZ
        </button>
        <button type="button" id="qd-eraser" class="quick-dialog-btn-square">
          GOMA
        </button>
        <button type="button" id="qd-add-frame" class="quick-dialog-btn-square">
          AGREGAR FRAME
        </button>
        <button
          type="button"
          id="qd-delete-frame"
          class="quick-dialog-btn-square"
        >
          BORRAR FRAME
        </button>
      </div>
      <label for="qd-range">Rango:</label>
      <input type="number" id="qd-range" min="1" value="5" />
      <div class="quick-dialog-row">
        <label
          ><input type="checkbox" id="qd-onion-toggle" checked /> Onion</label
        >
        <input
          type="number"
          id="qd-onion-opacity"
          min="0"
          max="1"
          step="0.05"
          value="0.35"
          title="Opacidad onion"
        />
        <input
          type="number"
          id="qd-onion-falloff"
          min="0"
          max="1"
          step="0.05"
          value="0.7"
          title="Onion gradiente"
        />
      </div>

      <div class="mini-xsheet" id="mini-xsheet"></div>
    </div>
    <script src="dibujo.js"></script>

    <script src="onion.js"></script>
    <script src="adjust.js"></script>
    <script src="cels.js"></script>
    <script src="undo.js"></script>
    <script src="shortcuts.js"></script>
    <script src="audio.js"></script>
    <script src="playback.js"></script>
    <script src="xsheet.js"></script>
    <script src="folder.js"></script>
    <script src="export.js"></script>
    <script src="import.js"></script>
    <script src="pegholereg.js"></script>
    <script src="project.js"></script>
    <script src="view.js"></script>
  </body>
</html>
