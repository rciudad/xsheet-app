<html>
  <style>
    .toolbar {
      /*display: flex;
      gap: 10px;
      align-items: center;*/
      height: auto;
      border-bottom: 1px solid gray;
    }
    .bottom-toolbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      font-family: sans-serif;
      border: 1px solid gray;
      height: auto;
    }
    .bottom-toolbar input {
      width: 55px;
      height: 30px;
      border-radius: 7px;
      border: 1px solid rgb(179, 179, 179);
      font-size: 16px;
    }
    .bottom-toolbar button {
      width: auto;
      height: 30px;
      border-radius: 7px;
      border: 1px solid rgb(179, 179, 179);
      font-size: 12px;
    }
    #drawingTable,
    #playCanvas {
      border: 1px solid gray;
    }
    #top-tool-container {
      width: 100%;
      height: 40px;
      position: fixed;
      top: 0;
      left: 0;
    }
    .xsheet {
      display: grid;
      position: fixed;
      top: 0;
      right: 0;
      background-color: rgb(209, 209, 209);
    }
    .xsheet-th {
      border: 1px solid gray;
      text-align: center;
      cursor: pointer;
      font-size: 12px;
    }
    .xsheet-th.active {
      background-color: #ffe08a;
    }
    .xsheet-tick {
      border: 1px solid gray;
      text-align: right;
      padding-right: 4px;
      font-size: 12px;
    }
    .xsheet-cell {
      border: 1px solid gray;
      background-color: whitesmoke;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
    }
    .xsheet-cell.active-col {
      background-color: #f0f0f0;
    }
    .xsheet-cell.current {
      background-color: #8ac6ff;
    }
    .xsheet-cell input {
      width: 45px;
      position: relative;
      left: 37px;
      top: 4px;
    }
    .xsheet-tick.current {
      background-color: #8ac6ff;
    }
    #audioPlayer {
      display: none;
    }
    .xsheet-audio-cell {
      border: 1px solid gray;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .xsheet-audio-bar {
      width: 80%;
      background: teal;
    }
  </style>
  <body>
    <div class="toolbar">
      <input type="color" id="selectedColor" />
      <input type="number" id="brushSize" />
      <button type="button" id="tool-pencil">LÁPIZ</button>
      <button type="button" id="tool-eraser">GOMA</button>

      <!-- Also can be used -->
      <!--input type="range" min="1" max="30"-->
      <label for="resolution">RES:</label>
      <input list="resolutions" name="resolution" id="resolution" />
      <datalist id="resolutions">
        <option value="800x600"></option>
        <option value="1280x720"></option>
        <option value="1440x1080"></option>
        <option value="1920x1080"></option>
        <option value="1080x1440"></option>
        <option value="1080x1920"></option>
      </datalist>
      <br />
      <button type="button" id="choose-folder">CARPETA</button>
      <span id="folder-status"></span>
      <button type="button" id="clear-folder" style="display: none">
        QUITAR CARPETA
      </button>
      <label for="export-prefix">Prefijo:</label>
      <input type="text" id="export-prefix" value="frame" />
      <label><input type="checkbox" id="export-bg-toggle" /> Fondo</label>
      <input type="color" id="export-bg-color" value="#ffffff" />
      <button type="button" id="export-png">EXPORT PNG</button>
      <label><input type="checkbox" id="export-zip-toggle" /> Zip</label>
      <label
        ><input type="checkbox" id="export-expand-toggle" checked /> Por
        hold</label
      >
      <button type="button" id="export-sequence">EXPORT SEQUENCE</button>
      <button type="button" id="export-video">EXPORT WEBM</button>
      <span id="export-video-status"></span>
      <button type="button" id="import-image-btn">IMPORTAR IMAGEN</button>
      <input
        type="file"
        id="import-image"
        accept="image/*"
        style="display: none"
      />
      <label
        ><input type="checkbox" id="import-replace" /> Reemplazar frame actual
        (en vez de insertar uno nuevo)</label
      >
      <button type="button" id="import-batch-btn">IMPORTAR BATCH</button>
      <input
        type="file"
        id="import-batch"
        accept="image/*"
        multiple
        style="display: none"
      />
      <button type="button" id="import-audio-btn">IMPORTAR AUDIO</button>
      <input
        type="file"
        id="import-audio"
        accept="audio/*"
        style="display: none"
      />
    </div>
    <audio id="audioPlayer"></audio>
    <div class="bottom-toolbar">
      <label
        >Región 1: x<input type="number" id="peg1x" value="140" /> y<input
          type="number"
          id="peg1y"
          value="430" />
        w<input type="number" id="peg1w" value="90" /> h<input
          type="number"
          id="peg1h"
          value="60"
      /></label>
      <label
        >Región 2: x<input type="number" id="peg2x" value="570" /> y<input
          type="number"
          id="peg2y"
          value="430" />
        w<input type="number" id="peg2w" value="90" /> h<input
          type="number"
          id="peg2h"
          value="60"
      /></label>
      <button type="button" id="peg-set-ref">FIJAR REFERENCIA</button>
      <button type="button" id="peg-align-cel">ALINEAR CEL ACTUAL</button>
      <button type="button" id="peg-align-layer">ALINEAR CAPA ACTUAL</button>
      <button type="button" id="prev"><</button>
      <button type="button" id="next">></button>
      <button type="button" id="new-frame">ADD FRAME</button>
      <button type="button" id="insert-frame-left">INSERTAR IZQUIERDA</button>
      <button type="button" id="new-layer">ADD LAYER</button><br />
      <label for="layers">LAYER:</label>
      <select id="layers">
        <option value="0">Selecciona una opción...</option>
      </select>
      <label for="layer-opacity">Opacidad capa:</label>
      <input
        type="number"
        id="layer-opacity"
        min="0"
        max="1"
        step="0.05"
        value="1"
      />
      <label
        ><input type="checkbox" id="onion-toggle" checked /> Onion skin</label
      >
      <label for="onion-opacity">Opacidad onion:</label>
      <input
        type="number"
        id="onion-opacity"
        min="0"
        max="1"
        step="0.05"
        value="0.35"
      />

      <button type="button" id="play">PLAY</button>
      <label for="fps">FPS:</label>
      <input type="number" id="fps" min="1" max="30" value="12" />
      <button type="button" id="clear-drawing">BORRAR DIBUJO</button>
      <button type="button" id="delete-frame">ELIMINAR FRAME</button><br />
      <label for="layer-hold-all">HOLD CAPA:</label>
      <input type="number" id="layer-hold-all" min="1" value="1" />
      <button type="button" id="apply-layer-hold">APLICAR</button>
      <button type="button" id="duplicate-frame">DUPLICAR</button>
      <label for="move-origin">Origen:</label>
      <input type="number" id="move-origin" min="1" value="1" />
      <label for="move-origin-end">Origen hasta:</label>
      <input type="number" id="move-origin-end" min="1" value="1" />

      <label for="move-dest">Destino:</label>
      <input type="number" id="move-dest" min="1" value="1" />

      <button type="button" id="move-frame">MOVER</button>
      <button type="button" id="copy-frame">COPIAR</button>
      <label for="range-start">REPRODUCIR/EXPORTAR Desde:</label>
      <input type="number" id="range-start" min="1" value="1" />
      <label for="range-end">Hasta:</label>
      <input type="number" id="range-end" min="1" value="1" />

      <button type="button" id="save-project">GUARDAR PROYECTO</button>
      <button type="button" id="import-project-btn">ABRIR PROYECTO</button>
      <input
        type="file"
        id="import-project"
        accept="application/json,.json"
        style="display: none"
      /><br />

      <button type="button" id="tool-pan">MANO</button>
      <button type="button" id="zoom-out">−</button>
      <span id="zoomReadout">100%</span>
      <button type="button" id="zoom-in">+</button>
      <button type="button" id="rotate-left">⟲</button>
      <span id="rotateReadout">0°</span>
      <button type="button" id="rotate-right">⟳</button>
      <button type="button" id="zoom-reset">RESET VISTA</button><br />
      <label
        >Crop: x<input type="number" id="cropX" value="0" /> y<input
          type="number"
          id="cropY"
          value="0" />
        w<input type="number" id="cropW" value="800" /> h<input
          type="number"
          id="cropH"
          value="600"
      /></label>
      <label
        >Bright.<input type="number" id="adjBrightness" value="0" step="0.05"
      /></label>
      <label
        >Contraste<input type="number" id="adjContrast" value="1" step="0.05"
      /></label>
      <label
        >Saturación<input
          type="number"
          id="adjSaturation"
          value="1"
          step="0.05"
      /></label>
      <label
        >WB R<input type="number" id="adjWbR" value="1" step="0.05"
      /></label>
      <label
        >WB B<input type="number" id="adjWbB" value="1" step="0.05"
      /></label>
      <button type="button" id="adjust-reset">RESET AJUSTES</button>
      <label
        ><input type="checkbox" id="grade-preview-toggle" /> Vista previa</label
      >
    </div>

    <div
      id="stageViewport"
      style="width: 800px; height: 600px; overflow: hidden; position: relative"
    >
      <div
        id="stage"
        style="position: absolute; top: 0; left: 0; width: 800px; height: 600px"
      >
        <canvas
          id="onion"
          width="800"
          height="600"
          style="position: absolute; top: 0; left: 0; pointer-events: none"
        ></canvas>
        <canvas
          id="drawingTable"
          width="800"
          height="600"
          style="position: absolute; top: 0; left: 0"
        ></canvas>
        <!--Se mantiene oculto mientras se dibuja, y se muestra (ocultando el canvas de dibujo) mientras se reproduce — la misma idea que el original con drawEl/playEl.-->
        <canvas
          id="playCanvas"
          width="800"
          height="600"
          style="position: absolute; top: 0; left: 0; display: none"
        ></canvas>

        <div
          id="pegOverlay1"
          style="
            position: absolute;
            border: 2px solid red;
            pointer-events: none;
          "
        ></div>
        <div
          id="pegOverlay2"
          style="
            position: absolute;
            border: 2px solid blue;
            pointer-events: none;
          "
        ></div>
        <div
          id="cropOverlay"
          style="
            position: absolute;
            border: 2px dashed lime;
            pointer-events: none;
          "
        ></div>
      </div>
    </div>

    <div
      id="folder-browse-overlay"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      "
    >
      <div
        style="
          background: #fff;
          color: #000;
          padding: 12px;
          width: 420px;
          max-width: 90vw;
          max-height: 80vh;
          display: flex;
          flex-direction: column;
        "
      >
        <strong id="folder-browse-title">Elegir archivo</strong>
        <small id="folder-browse-path" style="margin-bottom: 8px"></small>
        <div
          id="folder-browse-list"
          style="
            flex: 1;
            overflow-y: auto;
            border: 1px solid #999;
            margin-bottom: 8px;
            min-height: 120px;
          "
        ></div>
        <div>
          <button type="button" id="folder-browse-up">↑ SUBIR</button>
          <button type="button" id="folder-browse-elsewhere">
            BUSCAR EN OTRO LADO...
          </button>
          <button type="button" id="folder-browse-confirm">IMPORTAR</button>
          <button type="button" id="folder-browse-cancel">CANCELAR</button>
        </div>
      </div>
    </div>

    <div class="xsheet" id="xsheet"></div>
    <script src="dibujo.js"></script>
    <script src="onion.js"></script>
    <script src="adjust.js"></script>
    <script src="cels.js"></script>
    <script src="undo.js"></script>
    <script src="audio.js"></script>
    <script src="playback.js"></script>
    <script src="xsheet.js"></script>
    <script src="folder.js"></script>
    <script src="export.js"></script>
    <script src="import.js"></script>
    <script src="pegholereg.js"></script>
    <script src="project.js"></script>
    <script src="view.js"></script>
  </body>
</html>
