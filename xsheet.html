<html>
  <style>
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .bottom-toolbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      font-family: sans-serif;
      border: 1px solid gray;
      height: 100px;
    }
    .bottom-toolbar input {
      width: 55px;
      height: 30px;
      border-radius: 7px;
      border: 1px solid rgb(179, 179, 179);
      font-size: 16px;
    }
    .bottom-toolbar button {
      width: auto;
      height: 30px;
      border-radius: 7px;
      border: 1px solid rgb(179, 179, 179);
      font-size: 12px;
    }
    #drawingTable,
    #playCanvas {
      border: 1px solid gray;
    }
    #top-tool-container {
      width: 100%;
      height: 40px;
      position: fixed;
      top: 0;
      left: 0;
    }
    .xsheet {
      display: grid;
      position: fixed;
      top: 0;
      right: 0;
      background-color: rgb(209, 209, 209);
    }
    .xsheet-th {
      border: 1px solid gray;
      text-align: center;
      cursor: pointer;
      font-size: 12px;
    }
    .xsheet-th.active {
      background-color: #ffe08a;
    }
    .xsheet-tick {
      border: 1px solid gray;
      text-align: right;
      padding-right: 4px;
      font-size: 12px;
    }
    .xsheet-cell {
      border: 1px solid gray;
      background-color: whitesmoke;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
    }
    .xsheet-cell.active-col {
      background-color: #f0f0f0;
    }
    .xsheet-cell.current {
      background-color: #8ac6ff;
    }
    .xsheet-cell input {
      width: 50px;
      position: relative;
      left: 30px;
      top: 5px;
    }
    .xsheet-tick.current {
      background-color: #8ac6ff;
    }
    #audioPlayer {
      display: none;
    }
    .xsheet-audio-cell {
      border: 1px solid gray;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .xsheet-audio-bar {
      width: 80%;
      background: teal;
    }
  </style>
  <body>
    <div class="toolbar">
      <input type="color" id="selectedColor" />
      <input type="number" id="brushSize" />
      <button type="button" id="tool-pencil">LÁPIZ</button>
      <button type="button" id="tool-eraser">GOMA</button>

      <!-- Also can be used -->
      <!--input type="range" min="1" max="30"-->
      <label for="resolution">RES:</label>
      <input list="resolutions" name="resolution" id="resolution" />
      <datalist id="resolutions">
        <option value="800x600"></option>
        <option value="1280x720"></option>
        <option value="1440x1080"></option>
        <option value="1920x1080"></option>
        <option value="1080x1440"></option>
        <option value="1080x1920"></option>
      </datalist>

      <button type="button" id="export-png">EXPORT PNG</button>
      <button type="button" id="export-sequence">EXPORT SEQUENCE</button>
      <input type="file" id="import-image" accept="image/*" />
      <input type="file" id="import-batch" accept="image/*" multiple />
      <input type="file" id="import-audio" accept="audio/*" />
    </div>
    <audio id="audioPlayer"></audio>
    <div class="bottom-toolbar">
      <div class="toolbar">
        <label
          >Región 1: x<input type="number" id="peg1x" value="140" /> y<input
            type="number"
            id="peg1y"
            value="430" />
          w<input type="number" id="peg1w" value="90" /> h<input
            type="number"
            id="peg1h"
            value="60"
        /></label>
        <label
          >Región 2: x<input type="number" id="peg2x" value="570" /> y<input
            type="number"
            id="peg2y"
            value="430" />
          w<input type="number" id="peg2w" value="90" /> h<input
            type="number"
            id="peg2h"
            value="60"
        /></label>
        <button type="button" id="peg-set-ref">FIJAR REFERENCIA</button>
        <button type="button" id="peg-align-cel">ALINEAR CEL ACTUAL</button>
        <button type="button" id="peg-align-layer">ALINEAR CAPA ACTUAL</button>
        <button type="button" id="prev"><</button>
        <button type="button" id="next">></button>
        <button type="button" id="new-frame">ADD FRAME</button>
        <button type="button" id="new-layer">ADD LAYER</button>
        <label for="layers">LAYER:</label>
        <select id="layers">
          <option value="0">Selecciona una opción...</option>
        </select>
        <button type="button" id="play">PLAY</button>
        <label for="fps">FPS:</label>
        <input type="number" id="fps" min="1" max="30" value="12" />
        <button type="button" id="clear-drawing">BORRAR DIBUJO</button>
        <button type="button" id="delete-frame">ELIMINAR FRAME</button>
        <label for="layer-hold-all">HOLD CAPA:</label>
        <input type="number" id="layer-hold-all" min="1" value="1" />
        <button type="button" id="apply-layer-hold">APLICAR</button>
        <button type="button" id="duplicate-frame">DUPLICAR</button>
        <label for="move-origin">Origen:</label>
        <input type="number" id="move-origin" min="1" value="1" />
        <label for="move-dest">Destino:</label>
        <input type="number" id="move-dest" min="1" value="1" />
        <button type="button" id="move-frame">MOVER</button>
        <button type="button" id="copy-frame">COPIAR</button>
      </div>
    </div>

    <div style="position: relative; width: 800px; height: 600px">
      <canvas
        id="onion"
        width="800"
        height="600"
        style="position: absolute; top: 0; left: 0; pointer-events: none"
      ></canvas>
      <canvas
        id="drawingTable"
        width="800"
        height="600"
        style="position: absolute; top: 0; left: 0"
      ></canvas>
      <!--Se mantiene oculto mientras se dibuja, y se muestra (ocultando el canvas de dibujo) mientras se reproduce — la misma idea que el original con drawEl/playEl.-->
      <canvas
        id="playCanvas"
        width="800"
        height="600"
        style="position: absolute; top: 0; left: 0; display: none"
      ></canvas>
      <div
        id="pegOverlay1"
        style="position: absolute; border: 2px solid red; pointer-events: none"
      ></div>
      <div
        id="pegOverlay2"
        style="position: absolute; border: 2px solid blue; pointer-events: none"
      ></div>
    </div>

    <div class="xsheet" id="xsheet"></div>
    <script src="dibujo.js"></script>
    <script src="onion.js"></script>
    <script src="cels.js"></script>
    <script src="audio.js"></script>
    <script src="xsheet.js"></script>
    <script src="playback.js"></script>
    <script src="export.js"></script>
    <script src="import.js"></script>
    <script src="pegholereg.js"></script>
  </body>
</html>
